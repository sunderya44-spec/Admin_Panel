<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нэвтрэх | Whale</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="card login-card">
    <div class="brand-lockup" aria-label="Whale брэнд">
      <img class="brand-logo" src="{{ url_for('static', filename='logo-whale.png') }}" alt="Whale лого">
      <div>
        <div class="brand-wordmark">Whale</div>
        <p class="eyebrow">БРЭНДИЙН САМБАР</p>
      </div>
    </div>

    <h1>Тавтай морил</h1>
    <p class="muted">Мэдлэгээр дүүрэн ирээдүйг бүтээхийн тулд нэвтэрнэ үү.</p>

    {% if error %}
      <div class="alert" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">И-мэйл</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Нууц үг</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Нэвтрэх</button>
    </form>
  </main>
</body>
</html>
